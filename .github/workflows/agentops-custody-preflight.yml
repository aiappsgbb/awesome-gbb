name: AgentOps custody offline preflight

on:
  pull_request:
    paths:
      - ".github/workflows/agentops-custody-preflight.yml"
      - ".github/validation/agentops-custody/**"

permissions:
  contents: read

jobs:
  isolated-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      COPILOT_AUTO_UPDATE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Match production installation/resolution, not a historical cohort.
      # Node/Python/az are preinstalled; resolved versions and binary hashes
      # are recorded here and compared against the same bytes inside Docker.
      - name: Install production Copilot CLI version
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot@1.0.57-3 > "$RUNNER_TEMP/custody-npm-setup.log" 2>&1 \
            || { echo 'CUSTODY_SETUP=FAIL COPILOT'; exit 1; }

      - name: Install production azd resolution
        uses: Azure/setup-azd@v2.3.0
        with:
          version: stable

      - name: Install production uv version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.6"
          enable-cache: false

      - name: Verify immutable package
        id: package
        shell: bash
        env:
          PACKAGE_MANIFEST_SHA256: 92e08bbf79b31c61a1dc9c0f8e84dfcb80913192a2fdf507186a1592407a62d3
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(".github/validation/agentops-custody")
          raw = (root / "manifest.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["PACKAGE_MANIFEST_SHA256"]:
              sys.exit("CUSTODY_PACKAGE=FAIL MANIFEST_HASH")
          manifest = json.loads(raw)
          for name, key in (("validate.py", "harness_sha256"), ("snapshot.patch", "patch_sha256")):
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != manifest[key]:
                  sys.exit("CUSTODY_PACKAGE=FAIL INPUT_HASH")
          print("CUSTODY_PACKAGE=PASS")
          PY

      - name: Run inert production-boundary proof
        if: steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORK="$RUNNER_TEMP/agentops-custody-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          timeout --signal=TERM --kill-after=30s 540s \
            python3 -I .github/validation/agentops-custody/validate.py run \
              --work "$WORK" --repository "$GITHUB_WORKSPACE"

      - name: Verify exact-created cleanup
        if: always() && steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORK="$RUNNER_TEMP/agentops-custody-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          timeout --signal=TERM --kill-after=10s 90s \
            python3 -I .github/validation/agentops-custody/validate.py cleanup \
              --work "$WORK" --repository "$GITHUB_WORKSPACE"
