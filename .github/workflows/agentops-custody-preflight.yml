name: AgentOps custody offline preflight

on:
  pull_request:
    paths:
      - ".github/workflows/agentops-custody-preflight.yml"
      - ".github/validation/agentops-custody/**"

permissions:
  contents: read

jobs:
  base-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Base-only stage: no checkout, builds, tooling installs or candidate execution.
      - name: Verify locked base starts under the isolation flags
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import uuid

          image = "docker.io/library/ubuntu@sha256:496754492fb28b4d3049432f2ca787449331e23fb14f0dd3fffea86bf5a93eb4"
          owner = str(uuid.uuid4())
          name = "agentops-base-" + owner
          label = "agentops.validation.owner"
          phase = "preexisting-base-check"
          owns_base = False
          create_attempted = False
          passed = False
          cleanup_ok = True

          def emit(stage, status, **fields):
              print(json.dumps({"stage": stage, "status": status, **fields}, sort_keys=True), flush=True)

          def docker(*args, seconds=15):
              return subprocess.run(["docker", *args], check=True, capture_output=True,
                                    timeout=seconds)

          def inspect(kind, reference):
              try:
                  return json.loads(docker(kind, "inspect", reference).stdout)[0]
              except subprocess.CalledProcessError as error:
                  text = error.stderr.lower()
                  absent = b"no such image:" if kind == "image" else b"no such container:"
                  if error.returncode == 1 and absent in text:
                      return None
                  raise

          def report_failure(stage, error):
              info = {"error": type(error).__name__}
              if type(error) is RuntimeError and re.fullmatch("[A-Z_]+", str(error)):
                  info["classification"] = str(error)
              if isinstance(error, subprocess.CalledProcessError):
                  info["returncode"] = error.returncode
                  text = error.stderr[:4096].decode("utf-8", errors="replace")
                  info["classification"] = (
                      "ENOENT" if "no such file or directory" in text.lower() else
                      "PERMISSION_DENIED" if "permission denied" in text.lower() else
                      "COMMAND_FAILURE")
                  if re.search(r"exec [\"']?/bin/sh[\"']?(?: failed)?: [Nn]o such file or directory", text):
                      info["path"] = "/bin/sh"
              emit(stage, "FAIL", **info)

          try:
              if inspect("image", image) is not None:
                  raise RuntimeError("BASE_REFERENCE_PREEXISTS")
              if inspect("container", name) is not None:
                  raise RuntimeError("CONTAINER_NAME_PREEXISTS")
              owns_base = True
              phase = "pull-locked-base"
              docker("pull", "--platform", "linux/amd64", image, seconds=90)
              data = inspect("image", image)
              if data is None or data["Os"] != "linux" or data["Architecture"] != "amd64":
                  raise RuntimeError("BASE_ARCHITECTURE_MISMATCH")
              emit(phase, "PASS", base_config_digest=data["Id"], platform="linux/amd64")
              phase = "create-base-container"
              create_attempted = True
              docker("create", "--name", name, "--label", label + "=" + owner,
                     "--pull=never", "--platform", "linux/amd64",
                     "--init", "--read-only", "--log-driver=none",
                     "--cap-drop=ALL", "--security-opt=no-new-privileges",
                     "--user", f"{os.getuid()}:{os.getgid()}", "--network=none",
                     "--pids-limit", "256", "--stop-timeout", "10",
                     image, "/bin/sh", "-c", "printf 'BASE_PID1_READY\\n'")
              emit(phase, "PASS")
              phase = "base-shell-execution"
              result = docker("start", "--attach", name, seconds=15)
              state = inspect("container", name)
              if state is None or state["Config"]["Labels"].get(label) != owner:
                  raise RuntimeError("MISSING_OWNED_CONTAINER")
              exit_code = state["State"]["ExitCode"]
              marker = result.stdout == b"BASE_PID1_READY\n"
              if state["State"]["Running"] or exit_code != 0 or not marker:
                  emit(phase, "FAIL", exit_code=exit_code, marker_observed=marker)
                  raise RuntimeError("BASE_EXECUTION_CONTRACT")
              print("BASE_PID1_READY", flush=True)
              emit(phase, "PASS", exit_code=exit_code, marker_observed=True)
              passed = True
          except Exception as error:
              report_failure(phase, error)
          finally:
              if create_attempted:
                  try:
                      data = inspect("container", name)
                      if data is not None:
                          if data["Config"]["Labels"].get(label) != owner:
                              raise RuntimeError("CONTAINER_OWNERSHIP_MISMATCH")
                          docker("rm", "--force", data["Id"], seconds=20)
                      if inspect("container", name) is not None:
                          raise RuntimeError("CONTAINER_STILL_PRESENT")
                      emit("exact-container-cleanup", "PASS")
                  except Exception as error:
                      cleanup_ok = False
                      report_failure("exact-container-cleanup", error)
              if owns_base:
                  try:
                      if inspect("image", image) is not None:
                          docker("image", "rm", image, seconds=30)
                      if inspect("image", image) is not None:
                          raise RuntimeError("BASE_REFERENCE_STILL_PRESENT")
                      emit("exact-base-reference-cleanup", "PASS")
                  except Exception as error:
                      cleanup_ok = False
                      report_failure("exact-base-reference-cleanup", error)
              emit("base-only-result", "PASS" if passed and cleanup_ok else "FAIL",
                   custody_tested=False, tool_cohort_tested=False)
          sys.exit(0 if passed and cleanup_ok else 1)
          PY
