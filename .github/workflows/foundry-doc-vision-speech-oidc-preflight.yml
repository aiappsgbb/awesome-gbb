name: Foundry document vision speech OIDC preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FDVS_ACCOUNT_DIAGNOSTIC_FILE: /tmp/fdvs-account-diagnostic.txt
      FDVS_SPEECH_STT_DIAGNOSTIC_FILE: /tmp/fdvs-speech-stt-diagnostic.txt
      FDVS_STATUS_FILE: /tmp/fdvs-oidc-preflight.txt
    steps:
      - name: Initialize sanitized evidence
        run: |
          set -euo pipefail
          rm -f "$FDVS_ACCOUNT_DIAGNOSTIC_FILE"
          rm -f "$FDVS_SPEECH_STT_DIAGNOSTIC_FILE"
          cat > "$FDVS_STATUS_FILE" <<'EOF'
          FDVS_OIDC_PREFLIGHT_AUTH=NOT_RUN
          FDVS_OIDC_PREFLIGHT_ACCOUNT=NOT_RUN
          FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_USER=NOT_RUN
          FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_SPEECH_USER=NOT_RUN
          FDVS_OIDC_PREFLIGHT_DOCINTEL_PREBUILT_READ=NOT_RUN
          FDVS_OIDC_PREFLIGHT_SPEECH_TTS=NOT_RUN
          FDVS_OIDC_PREFLIGHT_SPEECH_STT=NOT_RUN
          FDVS_OIDC_PREFLIGHT_RESULT=FAIL
          EOF

      - name: Guard main ref
        id: ref-guard
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::FDVS preflight requires refs/heads/main"
            exit 1
          fi

      - name: Azure login via OIDC
        id: azure-login
        if: steps.ref-guard.outcome == 'success'
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        id: setup-python
        if: steps.azure-login.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded probe dependencies
        id: install-dependencies
        if: steps.setup-python.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            "azure-identity~=1.25.3" \
            "azure-ai-documentintelligence~=1.0.2" \
            "azure-cognitiveservices-speech~=1.51.0" \
            "Pillow~=11.3.0"

      - name: Run read-only live probes
        id: live-probes
        if: steps.install-dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY' >/dev/null 2>/dev/null
          from __future__ import annotations

          import io
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import urlparse
          import wave

          from azure.ai.documentintelligence import DocumentIntelligenceClient
          from azure.identity import DefaultAzureCredential
          import azure.cognitiveservices.speech as speechsdk
          from PIL import Image, ImageDraw


          STATUS_KEYS = (
              "FDVS_OIDC_PREFLIGHT_AUTH",
              "FDVS_OIDC_PREFLIGHT_ACCOUNT",
              "FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_USER",
              "FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_SPEECH_USER",
              "FDVS_OIDC_PREFLIGHT_DOCINTEL_PREBUILT_READ",
              "FDVS_OIDC_PREFLIGHT_SPEECH_TTS",
              "FDVS_OIDC_PREFLIGHT_SPEECH_STT",
              "FDVS_OIDC_PREFLIGHT_RESULT",
          )
          STATUS_VALUES = {"PASS", "FAIL", "NOT_RUN"}
          STATUS_FILE = Path(os.environ["FDVS_STATUS_FILE"])
          ACCOUNT_DIAGNOSTIC_CODES = (
              "ENDPOINT_PARSE",
              "ENDPOINT_SCHEME",
              "ENDPOINT_CREDENTIALS",
              "ENDPOINT_HOSTNAME",
              "ENDPOINT_HOST_PROJECT",
              "ENDPOINT_HOST_OPENAI",
              "ENDPOINT_HOST_SUFFIX",
              "ENDPOINT_QUERY",
              "ENDPOINT_FRAGMENT",
              "ENDPOINT_PATH",
              "ACCOUNT_HOST_DERIVATION",
              "ACCOUNT_LIST_QUERY",
              "ACCOUNT_RESOLUTION_CARDINALITY",
              "ACCOUNT_KIND",
              "ACCOUNT_ENDPOINT_PRESENCE",
              "ACCOUNT_ENDPOINT_MATCH",
              "IDENTITY_LIST_QUERY",
              "IDENTITY_RESOLUTION_CARDINALITY",
              "UNKNOWN",
          )
          ACCOUNT_DIAGNOSTIC_FILE = Path(
              os.environ["FDVS_ACCOUNT_DIAGNOSTIC_FILE"]
          )
          WAV_SPECIAL_CODES = (
              "WAV_INVALID",
              "WAV_UNKNOWN",
          )
          WAV_CHANNEL_CODES = (
              "MONO",
              "STEREO",
              "UNKNOWN",
          )
          WAV_SAMPLE_WIDTH_CODES = (
              "BITS_8",
              "BITS_16",
              "BITS_24",
              "BITS_32",
              "UNKNOWN",
          )
          WAV_SAMPLE_RATE_CODES = (
              "HZ_8000",
              "HZ_16000",
              "HZ_22050",
              "HZ_24000",
              "HZ_44100",
              "HZ_48000",
              "UNKNOWN",
          )
          WAV_COMPRESSION_CODES = (
              "PCM",
              "UNKNOWN",
          )
          WAV_FRAME_CODES = (
              "PRESENT",
              "EMPTY",
              "UNKNOWN",
          )
          STT_CANCELLATION_REASON_CODES = (
              "ERROR",
              "END_OF_STREAM",
              "BY_USER",
              "UNKNOWN",
          )
          STT_CANCELLATION_ERROR_CODES = (
              "NO_ERROR",
              "AUTHENTICATION_FAILURE",
              "BAD_REQUEST",
              "TOO_MANY_REQUESTS",
              "FORBIDDEN",
              "CONNECTION_FAILURE",
              "SERVICE_TIMEOUT",
              "SERVICE_ERROR",
              "SERVICE_UNAVAILABLE",
              "RUNTIME_ERROR",
              "EMBEDDED_MODEL_ERROR",
              "SERVICE_REDIRECT_PERMANENT",
              "SERVICE_REDIRECT_TEMPORARY",
              "UNKNOWN",
          )
          STT_SDK_EXCEPTION_CODES = (
              "SDK_EXCEPTION_RUNTIME_ERROR",
              "SDK_EXCEPTION_VALUE_ERROR",
              "SDK_EXCEPTION_TYPE_ERROR",
              "SDK_EXCEPTION_OS_ERROR",
              "UNKNOWN",
          )
          STT_BASE_OUTCOME_CODES = (
              "RECOGNIZED_TRANSCRIPT_MISMATCH",
              "NO_MATCH",
              "UNEXPECTED_RESULT_REASON",
              "UNKNOWN",
          )
          STT_DIAGNOSTIC_FILE = Path(
              os.environ["FDVS_SPEECH_STT_DIAGNOSTIC_FILE"]
          )
          WAV_CHANNEL_VALUE_CODES = {
              1: "MONO",
              2: "STEREO",
          }
          WAV_SAMPLE_WIDTH_VALUE_CODES = {
              1: "BITS_8",
              2: "BITS_16",
              3: "BITS_24",
              4: "BITS_32",
          }
          WAV_SAMPLE_RATE_VALUE_CODES = {
              8000: "HZ_8000",
              16000: "HZ_16000",
              22050: "HZ_22050",
              24000: "HZ_24000",
              44100: "HZ_44100",
              48000: "HZ_48000",
          }
          STT_CANCELLATION_REASON_NAME_CODES = {
              "Error": "ERROR",
              "EndOfStream": "END_OF_STREAM",
              "CancelledByUser": "BY_USER",
          }
          STT_CANCELLATION_ERROR_NAME_CODES = {
              "NoError": "NO_ERROR",
              "AuthenticationFailure": "AUTHENTICATION_FAILURE",
              "BadRequest": "BAD_REQUEST",
              "TooManyRequests": "TOO_MANY_REQUESTS",
              "Forbidden": "FORBIDDEN",
              "ConnectionFailure": "CONNECTION_FAILURE",
              "ServiceTimeout": "SERVICE_TIMEOUT",
              "ServiceError": "SERVICE_ERROR",
              "ServiceUnavailable": "SERVICE_UNAVAILABLE",
              "RuntimeError": "RUNTIME_ERROR",
              "EmbeddedModelError": "EMBEDDED_MODEL_ERROR",
              "ServiceRedirectPermanent": "SERVICE_REDIRECT_PERMANENT",
              "ServiceRedirectTemporary": "SERVICE_REDIRECT_TEMPORARY",
          }
          STT_EXCEPTION_CLASS_CODES = {
              "RuntimeError": "SDK_EXCEPTION_RUNTIME_ERROR",
              "ValueError": "SDK_EXCEPTION_VALUE_ERROR",
              "TypeError": "SDK_EXCEPTION_TYPE_ERROR",
              "OSError": "SDK_EXCEPTION_OS_ERROR",
          }


          def load_status() -> dict[str, str]:
              status: dict[str, str] = {}
              for line in STATUS_FILE.read_text(encoding="utf-8").splitlines():
                  key, value = line.split("=", 1)
                  status[key] = value
              if tuple(status) != STATUS_KEYS:
                  raise RuntimeError("status schema mismatch")
              if not set(status.values()) <= STATUS_VALUES:
                  raise RuntimeError("status value mismatch")
              return status


          def save_status(status: dict[str, str]) -> None:
              body = "".join(f"{key}={status[key]}\n" for key in STATUS_KEYS)
              STATUS_FILE.write_bytes(body.encode("utf-8"))


          status = load_status()


          def pass_stage(key: str) -> None:
              status[key] = "PASS"
              save_status(status)


          def fail_stage(key: str) -> None:
              status[key] = "FAIL"
              status["FDVS_OIDC_PREFLIGHT_RESULT"] = "FAIL"
              save_status(status)
              raise SystemExit(1)


          def required_env(name: str) -> str:
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError("missing environment")
              return value


          def az_json(*args: str) -> object:
              result = subprocess.run(
                  ["az", *args, "--only-show-errors", "--output", "json"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  raise RuntimeError("azure query failed")
              return json.loads(result.stdout)


          def normalize_words(value: str) -> set[str]:
              return set(re.findall(r"[a-z0-9]+", value.casefold()))


          def classify_wav(path: Path) -> str:
              try:
                  with wave.open(str(path), "rb") as wav_file:
                      channel_code = WAV_CHANNEL_VALUE_CODES.get(
                          wav_file.getnchannels(),
                          "UNKNOWN",
                      )
                      sample_width_code = WAV_SAMPLE_WIDTH_VALUE_CODES.get(
                          wav_file.getsampwidth(),
                          "UNKNOWN",
                      )
                      sample_rate_code = WAV_SAMPLE_RATE_VALUE_CODES.get(
                          wav_file.getframerate(),
                          "UNKNOWN",
                      )
                      compression_code = (
                          "PCM"
                          if wav_file.getcomptype() == "NONE"
                          else "UNKNOWN"
                      )
                      frame_code = (
                          "PRESENT" if wav_file.getnframes() > 0 else "EMPTY"
                      )
              except (EOFError, wave.Error):
                  return "WAV_INVALID"
              except Exception:
                  return "WAV_UNKNOWN"
              return (
                  f"WAV_{channel_code}_{sample_width_code}_{sample_rate_code}_"
                  f"{compression_code}_{frame_code}"
              )


          def safe_named_enum_code(value: object, codes: dict[str, str]) -> str:
              name = getattr(value, "name", None)
              return codes.get(name, "UNKNOWN") if isinstance(name, str) else "UNKNOWN"


          def classify_stt_cancellation(cancellation: object) -> str:
              reason_code = safe_named_enum_code(
                  cancellation.reason,
                  STT_CANCELLATION_REASON_NAME_CODES,
              )
              error_code = safe_named_enum_code(
                  cancellation.code,
                  STT_CANCELLATION_ERROR_NAME_CODES,
              )
              return f"CANCELED_{reason_code}_{error_code}"


          def classify_stt_exception(error: Exception) -> str:
              return STT_EXCEPTION_CLASS_CODES.get(type(error).__name__, "UNKNOWN")


          def write_stt_diagnostic(wav_code: str, outcome_code: str) -> None:
              STT_DIAGNOSTIC_FILE.write_bytes(
                  f"{wav_code}__{outcome_code}\n".encode("ascii")
              )


          try:
              endpoint = required_env("AZURE_AI_ENDPOINT")
              client_id = required_env("AZURE_CLIENT_ID")
              subscription_id = required_env("AZURE_SUBSCRIPTION_ID")
              required_env("AZURE_TENANT_ID")
              account = subprocess.run(
                  [
                      "az",
                      "account",
                      "show",
                      "--query",
                      "id",
                      "--output",
                      "tsv",
                      "--only-show-errors",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if account.returncode != 0 or account.stdout.strip() != subscription_id:
                  raise RuntimeError("authenticated context mismatch")
              token = subprocess.run(
                  [
                      "az",
                      "account",
                      "get-access-token",
                      "--resource",
                      "https://cognitiveservices.azure.com",
                      "--query",
                      "expiresOn",
                      "--output",
                      "tsv",
                      "--only-show-errors",
                  ],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if token.returncode != 0:
                  raise RuntimeError("token acquisition failed")
              pass_stage("FDVS_OIDC_PREFLIGHT_AUTH")
          except Exception:
              fail_stage("FDVS_OIDC_PREFLIGHT_AUTH")

          account_diagnostic = "UNKNOWN"
          try:
              account_diagnostic = "ENDPOINT_PARSE"
              try:
                  parsed = urlparse(endpoint)
              except Exception:
                  raise RuntimeError("endpoint parse mismatch")
              suffix = ".cognitiveservices.azure.com"
              account_diagnostic = "ENDPOINT_SCHEME"
              if parsed.scheme != "https":
                  raise RuntimeError("endpoint scheme mismatch")
              account_diagnostic = "ENDPOINT_CREDENTIALS"
              if parsed.username is not None or parsed.password is not None:
                  raise RuntimeError("endpoint credentials mismatch")
              account_diagnostic = "ENDPOINT_HOSTNAME"
              if not parsed.hostname:
                  raise RuntimeError("endpoint hostname mismatch")
              account_diagnostic = "ENDPOINT_HOST_PROJECT"
              if parsed.hostname.endswith(".services.ai.azure.com"):
                  raise RuntimeError("endpoint project host mismatch")
              account_diagnostic = "ENDPOINT_HOST_OPENAI"
              if parsed.hostname.endswith(".openai.azure.com"):
                  raise RuntimeError("endpoint openai host mismatch")
              account_diagnostic = "ENDPOINT_HOST_SUFFIX"
              if not parsed.hostname.endswith(suffix):
                  raise RuntimeError("endpoint host suffix mismatch")
              account_diagnostic = "ENDPOINT_QUERY"
              if parsed.query:
                  raise RuntimeError("endpoint query mismatch")
              account_diagnostic = "ENDPOINT_FRAGMENT"
              if parsed.fragment:
                  raise RuntimeError("endpoint fragment mismatch")
              account_diagnostic = "ENDPOINT_PATH"
              if parsed.path not in {"", "/"}:
                  raise RuntimeError("endpoint path mismatch")
              account_diagnostic = "ACCOUNT_HOST_DERIVATION"
              account_name = parsed.hostname[: -len(suffix)]
              if not account_name or "." in account_name:
                  raise RuntimeError("account host mismatch")

              account_diagnostic = "ACCOUNT_LIST_QUERY"
              accounts = az_json(
                  "cognitiveservices",
                  "account",
                  "list",
                  "--subscription",
                  subscription_id,
              )
              matches = [
                  item
                  for item in accounts
                  if isinstance(item, dict) and item.get("name") == account_name
              ]
              account_diagnostic = "ACCOUNT_RESOLUTION_CARDINALITY"
              if len(matches) != 1:
                  raise RuntimeError("account resolution mismatch")
              account = matches[0]
              account_diagnostic = "ACCOUNT_KIND"
              if account["kind"] != "AIServices":
                  raise RuntimeError("account kind mismatch")
              account_diagnostic = "ACCOUNT_ENDPOINT_PRESENCE"
              account_endpoint = (
                  account.get("properties", {}).get("endpoint")
                  or account.get("endpoint")
              )
              if not account_endpoint:
                  raise RuntimeError("account endpoint missing")
              account_diagnostic = "ACCOUNT_ENDPOINT_MATCH"
              if urlparse(account_endpoint).hostname != parsed.hostname:
                  raise RuntimeError("account endpoint mismatch")
              account_diagnostic = "UNKNOWN"
              account_id = str(account["id"])

              account_diagnostic = "IDENTITY_LIST_QUERY"
              identities = az_json(
                  "identity",
                  "list",
                  "--subscription",
                  subscription_id,
              )
              identity_matches = [
                  item
                  for item in identities
                  if isinstance(item, dict)
                  and str(item.get("clientId", "")).casefold() == client_id.casefold()
              ]
              account_diagnostic = "IDENTITY_RESOLUTION_CARDINALITY"
              if len(identity_matches) != 1:
                  raise RuntimeError("identity resolution mismatch")
              account_diagnostic = "UNKNOWN"
              principal_id = str(identity_matches[0]["principalId"])
              pass_stage("FDVS_OIDC_PREFLIGHT_ACCOUNT")
          except Exception:
              if account_diagnostic not in ACCOUNT_DIAGNOSTIC_CODES:
                  account_diagnostic = "UNKNOWN"
              ACCOUNT_DIAGNOSTIC_FILE.write_bytes(
                  f"{account_diagnostic}\n".encode("ascii")
              )
              fail_stage("FDVS_OIDC_PREFLIGHT_ACCOUNT")

          try:
              assignments = az_json(
                  "role",
                  "assignment",
                  "list",
                  "--assignee-object-id",
                  principal_id,
                  "--scope",
                  account_id,
                  "--include-inherited",
              )
              role_names = {
                  str(item.get("roleDefinitionName", ""))
                  for item in assignments
                  if isinstance(item, dict)
              }
              if "Cognitive Services User" not in role_names:
                  raise RuntimeError("required role missing")
              pass_stage(
                  "FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_USER"
              )
          except Exception:
              fail_stage(
                  "FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_USER"
              )

          try:
              if "Cognitive Services Speech User" not in role_names:
                  raise RuntimeError("required role missing")
              pass_stage(
                  "FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_SPEECH_USER"
              )
          except Exception:
              fail_stage(
                  "FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_SPEECH_USER"
              )

          credential = DefaultAzureCredential()
          wav_path = Path("/tmp/fdvs-preflight.wav")
          phrase = "preflight speech check"
          try:
              try:
                  image = Image.new("RGB", (900, 180), "white")
                  ImageDraw.Draw(image).text(
                      (40, 70),
                      "FDVS document preflight nonce 20260807",
                      fill="black",
                  )
                  document = io.BytesIO()
                  image.save(document, format="PNG")
                  document.seek(0)
                  with DocumentIntelligenceClient(
                      endpoint=endpoint,
                      credential=credential,
                  ) as client:
                      poller = client.begin_analyze_document(
                          "prebuilt-read",
                          body=document,
                          content_type="image/png",
                      )
                      result = poller.result()
                  if "FDVS document preflight nonce 20260807" not in (
                      result.content or ""
                  ):
                      raise RuntimeError("document content mismatch")
                  pass_stage("FDVS_OIDC_PREFLIGHT_DOCINTEL_PREBUILT_READ")
              except Exception:
                  fail_stage("FDVS_OIDC_PREFLIGHT_DOCINTEL_PREBUILT_READ")

              try:
                  speech_config = speechsdk.SpeechConfig(
                      token_credential=credential,
                      endpoint=endpoint,
                  )
                  audio_output = speechsdk.audio.AudioOutputConfig(
                      filename=str(wav_path)
                  )
                  synthesizer = speechsdk.SpeechSynthesizer(
                      speech_config=speech_config,
                      audio_config=audio_output,
                  )
                  synthesis = synthesizer.speak_text_async(phrase).get()
                  if (
                      synthesis.reason
                      != speechsdk.ResultReason.SynthesizingAudioCompleted
                      or not synthesis.audio_data
                      or not wav_path.is_file()
                      or wav_path.stat().st_size == 0
                  ):
                      raise RuntimeError("speech synthesis mismatch")
                  pass_stage("FDVS_OIDC_PREFLIGHT_SPEECH_TTS")
              except Exception:
                  fail_stage("FDVS_OIDC_PREFLIGHT_SPEECH_TTS")

              wav_diagnostic = classify_wav(wav_path)
              try:
                  audio_input = speechsdk.audio.AudioConfig(
                      filename=str(wav_path)
                  )
                  recognizer = speechsdk.SpeechRecognizer(
                      speech_config=speech_config,
                      language="en-US",
                      audio_config=audio_input,
                  )
                  recognition = recognizer.recognize_once_async().get()
                  outcome = "UNKNOWN"
                  if recognition.reason == speechsdk.ResultReason.RecognizedSpeech:
                      if not normalize_words(phrase) <= normalize_words(
                          recognition.text or ""
                      ):
                          outcome = "RECOGNIZED_TRANSCRIPT_MISMATCH"
                      else:
                          outcome = ""
                  elif recognition.reason == speechsdk.ResultReason.NoMatch:
                      outcome = "NO_MATCH"
                  elif recognition.reason == speechsdk.ResultReason.Canceled:
                      cancellation = speechsdk.CancellationDetails(recognition)
                      outcome = classify_stt_cancellation(cancellation)
                  else:
                      outcome = "UNEXPECTED_RESULT_REASON"
                  if outcome:
                      write_stt_diagnostic(wav_diagnostic, outcome)
                      fail_stage("FDVS_OIDC_PREFLIGHT_SPEECH_STT")
                  pass_stage("FDVS_OIDC_PREFLIGHT_SPEECH_STT")
              except Exception as error:
                  write_stt_diagnostic(
                      wav_diagnostic,
                      classify_stt_exception(error),
                  )
                  fail_stage("FDVS_OIDC_PREFLIGHT_SPEECH_STT")
          finally:
              wav_path.unlink(missing_ok=True)
              credential.close()

          status["FDVS_OIDC_PREFLIGHT_RESULT"] = "PASS"
          save_status(status)
          PY

      - name: Finalize sanitized evidence
        if: always()
        env:
          REF_OUTCOME: ${{ steps.ref-guard.outcome }}
          LOGIN_OUTCOME: ${{ steps.azure-login.outcome }}
          PYTHON_OUTCOME: ${{ steps.setup-python.outcome }}
          INSTALL_OUTCOME: ${{ steps.install-dependencies.outcome }}
          PROBE_OUTCOME: ${{ steps.live-probes.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          STATUS_KEYS = (
              "FDVS_OIDC_PREFLIGHT_AUTH",
              "FDVS_OIDC_PREFLIGHT_ACCOUNT",
              "FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_USER",
              "FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_SPEECH_USER",
              "FDVS_OIDC_PREFLIGHT_DOCINTEL_PREBUILT_READ",
              "FDVS_OIDC_PREFLIGHT_SPEECH_TTS",
              "FDVS_OIDC_PREFLIGHT_SPEECH_STT",
              "FDVS_OIDC_PREFLIGHT_RESULT",
          )
          STATUS_VALUES = {"PASS", "FAIL", "NOT_RUN"}
          ACCOUNT_DIAGNOSTIC_CODES = (
              "ENDPOINT_PARSE",
              "ENDPOINT_SCHEME",
              "ENDPOINT_CREDENTIALS",
              "ENDPOINT_HOSTNAME",
              "ENDPOINT_HOST_PROJECT",
              "ENDPOINT_HOST_OPENAI",
              "ENDPOINT_HOST_SUFFIX",
              "ENDPOINT_QUERY",
              "ENDPOINT_FRAGMENT",
              "ENDPOINT_PATH",
              "ACCOUNT_HOST_DERIVATION",
              "ACCOUNT_LIST_QUERY",
              "ACCOUNT_RESOLUTION_CARDINALITY",
              "ACCOUNT_KIND",
              "ACCOUNT_ENDPOINT_PRESENCE",
              "ACCOUNT_ENDPOINT_MATCH",
              "IDENTITY_LIST_QUERY",
              "IDENTITY_RESOLUTION_CARDINALITY",
              "UNKNOWN",
          )
          WAV_SPECIAL_CODES = (
              "WAV_INVALID",
              "WAV_UNKNOWN",
          )
          WAV_CHANNEL_CODES = (
              "MONO",
              "STEREO",
              "UNKNOWN",
          )
          WAV_SAMPLE_WIDTH_CODES = (
              "BITS_8",
              "BITS_16",
              "BITS_24",
              "BITS_32",
              "UNKNOWN",
          )
          WAV_SAMPLE_RATE_CODES = (
              "HZ_8000",
              "HZ_16000",
              "HZ_22050",
              "HZ_24000",
              "HZ_44100",
              "HZ_48000",
              "UNKNOWN",
          )
          WAV_COMPRESSION_CODES = (
              "PCM",
              "UNKNOWN",
          )
          WAV_FRAME_CODES = (
              "PRESENT",
              "EMPTY",
              "UNKNOWN",
          )
          STT_CANCELLATION_REASON_CODES = (
              "ERROR",
              "END_OF_STREAM",
              "BY_USER",
              "UNKNOWN",
          )
          STT_CANCELLATION_ERROR_CODES = (
              "NO_ERROR",
              "AUTHENTICATION_FAILURE",
              "BAD_REQUEST",
              "TOO_MANY_REQUESTS",
              "FORBIDDEN",
              "CONNECTION_FAILURE",
              "SERVICE_TIMEOUT",
              "SERVICE_ERROR",
              "SERVICE_UNAVAILABLE",
              "RUNTIME_ERROR",
              "EMBEDDED_MODEL_ERROR",
              "SERVICE_REDIRECT_PERMANENT",
              "SERVICE_REDIRECT_TEMPORARY",
              "UNKNOWN",
          )
          STT_SDK_EXCEPTION_CODES = (
              "SDK_EXCEPTION_RUNTIME_ERROR",
              "SDK_EXCEPTION_VALUE_ERROR",
              "SDK_EXCEPTION_TYPE_ERROR",
              "SDK_EXCEPTION_OS_ERROR",
              "UNKNOWN",
          )
          STT_BASE_OUTCOME_CODES = (
              "RECOGNIZED_TRANSCRIPT_MISMATCH",
              "NO_MATCH",
              "UNEXPECTED_RESULT_REASON",
              "UNKNOWN",
          )


          def validated_stt_diagnostic(raw: bytes) -> str:
              try:
                  candidate = raw.decode("ascii")
              except UnicodeDecodeError:
                  return "UNKNOWN"
              if candidate.count("\n") != 1 or not candidate.endswith("\n"):
                  return "UNKNOWN"
              candidate = candidate[:-1]
              parts = candidate.split("__")
              if len(parts) != 2:
                  return "UNKNOWN"
              wav_code, outcome_code = parts

              choices = lambda codes: "(?:" + "|".join(
                  re.escape(code) for code in codes
              ) + ")"
              wav_pattern = re.compile(
                  "^WAV_"
                  + choices(WAV_CHANNEL_CODES)
                  + "_"
                  + choices(WAV_SAMPLE_WIDTH_CODES)
                  + "_"
                  + choices(WAV_SAMPLE_RATE_CODES)
                  + "_"
                  + choices(WAV_COMPRESSION_CODES)
                  + "_"
                  + choices(WAV_FRAME_CODES)
                  + "$"
              )
              cancellation_pattern = re.compile(
                  "^CANCELED_"
                  + choices(STT_CANCELLATION_REASON_CODES)
                  + "_"
                  + choices(STT_CANCELLATION_ERROR_CODES)
                  + "$"
              )
              if (
                  wav_code not in WAV_SPECIAL_CODES
                  and wav_pattern.fullmatch(wav_code) is None
              ):
                  return "UNKNOWN"
              if (
                  outcome_code not in STT_BASE_OUTCOME_CODES
                  and outcome_code not in STT_SDK_EXCEPTION_CODES
                  and cancellation_pattern.fullmatch(outcome_code) is None
              ):
                  return "UNKNOWN"
              return candidate


          diagnostic_file = Path(os.environ["FDVS_ACCOUNT_DIAGNOSTIC_FILE"])
          if diagnostic_file.is_file():
              raw_diagnostic = diagnostic_file.read_bytes()
              diagnostic = next(
                  (
                      code
                      for code in ACCOUNT_DIAGNOSTIC_CODES
                      if raw_diagnostic == f"{code}\n".encode("ascii")
                  ),
                  "UNKNOWN",
              )
              print(f"::error::FDVS_ACCOUNT_DIAGNOSTIC={diagnostic}")

          stt_diagnostic_file = Path(
              os.environ["FDVS_SPEECH_STT_DIAGNOSTIC_FILE"]
          )
          if stt_diagnostic_file.is_file():
              raw_diagnostic = stt_diagnostic_file.read_bytes()
              diagnostic = validated_stt_diagnostic(raw_diagnostic)
              print(f"::error::FDVS_SPEECH_STT_DIAGNOSTIC={diagnostic}")

          status_file = Path(os.environ["FDVS_STATUS_FILE"])
          status = dict(
              line.split("=", 1)
              for line in status_file.read_text(encoding="utf-8").splitlines()
          )
          if tuple(status) != STATUS_KEYS or not set(status.values()) <= STATUS_VALUES:
              raise SystemExit("invalid evidence schema")

          outcomes = (
              os.environ["REF_OUTCOME"],
              os.environ["LOGIN_OUTCOME"],
              os.environ["PYTHON_OUTCOME"],
              os.environ["INSTALL_OUTCOME"],
              os.environ["PROBE_OUTCOME"],
          )
          if outcomes[0] != "success" or outcomes[1] != "success":
              status["FDVS_OIDC_PREFLIGHT_AUTH"] = "FAIL"
          elif outcomes[2] != "success" or outcomes[3] != "success":
              status["FDVS_OIDC_PREFLIGHT_AUTH"] = "PASS"
              status["FDVS_OIDC_PREFLIGHT_ACCOUNT"] = "FAIL"
          elif outcomes[4] != "success":
              for key in STATUS_KEYS[:-1]:
                  if status[key] == "NOT_RUN":
                      status[key] = "FAIL"
                      break

          if not all(status[key] == "PASS" for key in STATUS_KEYS[:-1]):
              status["FDVS_OIDC_PREFLIGHT_RESULT"] = "FAIL"
          body = "".join(f"{key}={status[key]}\n" for key in STATUS_KEYS)
          status_file.write_bytes(body.encode("utf-8"))
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdvs-oidc-preflight
          path: /tmp/fdvs-oidc-preflight.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exact PASS bytes
        if: always()
        run: |
          set -euo pipefail
          STATUS_FILE=/tmp/fdvs-oidc-preflight.txt
          EXPECTED_FILE=/tmp/fdvs-oidc-preflight-expected.txt
          cat > "$EXPECTED_FILE" <<'EOF'
          FDVS_OIDC_PREFLIGHT_AUTH=PASS
          FDVS_OIDC_PREFLIGHT_ACCOUNT=PASS
          FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_USER=PASS
          FDVS_OIDC_PREFLIGHT_RBAC_COGNITIVE_SERVICES_SPEECH_USER=PASS
          FDVS_OIDC_PREFLIGHT_DOCINTEL_PREBUILT_READ=PASS
          FDVS_OIDC_PREFLIGHT_SPEECH_TTS=PASS
          FDVS_OIDC_PREFLIGHT_SPEECH_STT=PASS
          FDVS_OIDC_PREFLIGHT_RESULT=PASS
          EOF
          if ! cmp -s "$STATUS_FILE" "$EXPECTED_FILE"; then
            echo "::error::FDVS OIDC preflight failed"
            exit 1
          fi
          echo "FDVS OIDC preflight passed"
