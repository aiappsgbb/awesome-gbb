# .github/workflows/copilot-cli-foundry-auth-smoke.yml
#
# HARD GATE for the 2026-05-30 deep-audit + testing-rethink plan.
#
# Proves a single load-bearing assumption: the released Copilot CLI can
# authenticate against the project's Foundry-routed model deployment using
# the same OIDC federated UAMI we use everywhere else in this repo. If this
# workflow is red on `main`, every "Copilot-as-test-runner" workflow that
# Phase 2+ ships is also red — and the deep-audit plan halts until it's
# fixed. See `docs/superpowers/plans/2026-05-30-deep-audit-and-testing-rethink.md`.
#
# Env-var names verified against released CLI 1.0.57-2 (cask 1.0.48) via
# `copilot help providers` and `copilot help environment`. Reference:
# Task 1.0 notes in the session-state files dir.

name: copilot-cli-foundry-auth-smoke

on:
  workflow_dispatch:
  pull_request:
    # Run on PRs that touch THIS workflow file so we can validate the
    # auth contract live before merging changes to it. Once we trust
    # the gate, this trigger can be removed; workflow_dispatch + cron
    # are the steady-state triggers.
    paths:
      - ".github/workflows/copilot-cli-foundry-auth-smoke.yml"
      - "scripts/configure-ci-model-provider.py"
      - "scripts/tests/test_ci_model_provider.py"
  schedule:
    # Monday 06:17 UTC — runs ~45min before skill-freshness (Monday 07:00).
    # If this is red, the freshness loop's auto-PRs are pointless because
    # nothing else in Phase 2+ can validate anyway.
    - cron: "17 6 * * 1"

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        provider: [foundry, citadel]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Copilot CLI
        run: |
          # Node 22 is pre-installed on ubuntu-latest. npm install is the
          # method documented at
          # https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-cli
          npm install -g @github/copilot
          copilot --version

      - name: Get Foundry bearer token
        run: |
          set -euo pipefail
          echo "Fetching Foundry bearer token for ai.azure.com (Foundry project audience)…"
          # `--resource` takes the v1 AAD audience identifier (the SP appId
          # URI). The v2 scope form (`<resource>/.default`) is only valid
          # with `--scope`. Passing the v2 form to `--resource` produces
          # AADSTS500011 "resource principal not found" because AAD looks
          # up the SP by the literal string and there is no SP named
          # "<resource>/.default".
          #
          # AUDIENCE NOTE (2026-06-10): switched from
          # `https://cognitiveservices.azure.com` to `https://ai.azure.com`.
          # Foundry **project** endpoints
          # (`*.services.ai.azure.com/api/projects/<name>/openai/v1/*`)
          # validate tokens against the `https://ai.azure.com` AAD app, NOT
          # the legacy Cognitive Services audience. Hitting a project
          # endpoint with a `cognitiveservices.azure.com` token returns
          # HTTP 401 with no body — the audience-mismatch signature.
          # Reproducible via curl matrix on 2026-06-10 after CI account
          # recovery. The old audience worked against account-host URLs
          # (`*.cognitiveservices.azure.com/openai/v1/*`); the
          # post-2026-06-09 endpoint contract uses project-host URLs.
          #
          # `tr -d '\r\n'` defends against trailing whitespace from `-o tsv`
          # that would otherwise produce a cryptic 401 from Foundry instead
          # of a clear token-acquisition failure.
          TOKEN=$(az account get-access-token \
            --resource https://ai.azure.com \
            --query accessToken -o tsv | tr -d '\r\n')
          # Mask the token in logs before exporting it to subsequent steps.
          echo "::add-mask::$TOKEN"
          echo "COPILOT_PROVIDER_BEARER_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Configure Copilot model provider
        env:
          CI_MODEL_PROVIDER: ${{ matrix.provider }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          CITADEL_CI_GATEWAY_URL: ${{ secrets.CITADEL_CI_GATEWAY_URL }}
          CITADEL_CI_API_KEY: ${{ secrets.CITADEL_CI_API_KEY }}
        run: python3 scripts/configure-ci-model-provider.py

      - name: Smoke test — one-shot prompt that requires model auth
        env:
          # Driver provider/auth come from the same selector as the matrix.
          COPILOT_PROVIDER_MAX_PROMPT_TOKENS: "128000"
          COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: "512"
          # Disable auto-update in CI explicitly (already auto-disabled when
          # `CI` is set, but cheap insurance).
          COPILOT_AUTO_UPDATE: "false"
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # --disable-builtin-mcps drops the GitHub MCP server (we don't
          # want this smoke test depending on github.com reachability —
          # the whole point is to isolate the Foundry auth path).
          OUT=$(copilot -s -p "Reply with the single word PONG and nothing else. Do not call tools." \
                        --no-custom-instructions --no-ask-user --no-auto-update \
                        --deny-tool shell --deny-tool write \
                        --disable-builtin-mcps)
          echo "----- copilot output -----"
          echo "$OUT"
          echo "--------------------------"
          echo "$OUT" | grep -qx "PONG" || {
            echo "smoke FAILED: expected 'PONG' in copilot output but none found"
            exit 1
          }
          echo "smoke PASSED"
