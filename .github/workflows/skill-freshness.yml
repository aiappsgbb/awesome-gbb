name: Skill freshness

on:
  schedule:
    # Monday 07:00 UTC — quiet hour, doesn't collide with workshops
    - cron: "0 7 * * 1"
    # Thursday 07:00 UTC — redundancy in case Monday runner/GHA has an outage
    - cron: "0 7 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no issue writes)"
        type: boolean
        default: false
      execution_mode:
        description: "Execution mode override"
        type: choice
        options:
          - repository
          - manual
          - copilot
        default: repository

permissions:
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pyyaml requests

      - name: Detect drift and upsert issues
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Safe default is the repository variable (manual) so scheduled runs
          # stay conservative; workflow_dispatch can override to repository,
          # manual, or copilot for one-off reversals.
          CONFIGURED_MODE: ${{ vars.FRESHNESS_EXECUTION_MODE || 'manual' }}
          DISPATCH_MODE: ${{ inputs.execution_mode || 'repository' }}
          # GH_ASSIGN_TOKEN is used for both bot assignment and bot removal.
          # The default GITHUB_TOKEN cannot assign/remove the Copilot bot, so
          # add COPILOT_ASSIGN_PAT to enable ownership reconciliation.
          GH_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          MODE="$CONFIGURED_MODE"
          if [ "$DISPATCH_MODE" != "repository" ]; then MODE="$DISPATCH_MODE"; fi
          case "$MODE" in
            manual|copilot) ;;
            *) echo "::error::Invalid FRESHNESS_EXECUTION_MODE=$MODE"; exit 2 ;;
          esac
          ARGS="--upsert-issues --consolidated --execution-mode $MODE --labels freshness,automation --output report.md --print-report"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/check-freshness.py $ARGS

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: report.md
          if-no-files-found: warn
