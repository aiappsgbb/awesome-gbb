# Freshness tier C: original protocol and standard-library persistence helper.
last_validated: "2026-09-30"
validated_by: copilot
validation_notes: |
  Local persistence tests and catalog checks are recorded separately from
  behavioral acceptance in docs/maintenance/progress-guard-validation.md.
  This date does not certify agent compliance or native runtime discovery.
  tests/scenarios.md lists unexecuted behavioral acceptance scenarios.
  Compaction control guidance is documentation-backed; selective readback is
  tested with synthetic ledger events, not a native runtime compaction.
  Child terminal reporting and parent receipt persistence have synthetic local
  coverage, not observed App multi-session enforcement.
  Optional scale-out fields have scripted state/output coverage, not independent
  verification of ownership, capacity, authorization or proof validity.
  Approval records have scoped-identity/result/persistence coverage; actual
  question suppression, mandate interpretation and native compaction are unproven.
  Coordinator roles and terminal-only routing have static contract and scripted
  persistence coverage, not observed model compliance or message suppression.
  Version 2 preserves schema 1 and existing approval/coordination evidence fields.
  No Azure connection, deployment, external service, hooks or watchers required.
