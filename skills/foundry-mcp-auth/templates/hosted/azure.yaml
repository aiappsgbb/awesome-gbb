name: delegated-hosted
requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.14"
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
  delegated-agent:
    host: azure.ai.agent
    project: app
    language: docker
    uses:
      - ai-project
    kind: hosted
    name: delegated-agent
    description: Read-only delegated MCP through the upstream Toolbox wrapper
    protocols:
      - protocol: responses
        version: 2.0.0
    docker:
      path: templates/hosted/Dockerfile
      context: .
      remoteBuild: true
      platform: linux/amd64
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: TOOLBOX_ENDPOINT
        value: ${TOOLBOX_ENDPOINT}
    container:
      resources:
        cpu: "1"
        memory: 2Gi
infra:
  provider: microsoft.foundry
