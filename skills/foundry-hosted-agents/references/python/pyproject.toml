# Canonical pyproject.toml — pinned hosted-agent deps.
#
# Source of truth for the prose example in
# `../../SKILL.md § Dependencies (pyproject.toml)`. Mirrors the F1
# patch from PR #180 (DO NOT install the meta-package).
#
# Five pyproject mistakes this file prevents:
#   1. `agent-framework>=1.14.0` meta-package — floating/transitive
#      resolution is non-deterministic. Pin hosted-agent sub-packages directly.
#   2. Transitive Agent Server beta packages — uv does not admit their
#      prereleases under `if-necessary-or-explicit` unless they are direct.
#      Pin the coherent core/responses/invocations beta train exactly.
#   3. Floating `azure-ai-projects` via transitive resolution — pin direct
#      `azure-ai-projects~=2.3.0` because Foundry is still held below 2.4.
#   4. `agent-framework-core[mcp]` extra — does NOT exist. MCP tools
#      are top-level exports of agent_framework; the bare pin already covers them.
#   5. Missing `mcp~=1.29.0` — agent_framework_foundry_hosting imports
#      `from mcp import McpError` at module-load time; container crashes at
#      startup with `ModuleNotFoundError: No module named 'mcp'` even when no
#      MCP tool is wired. Surfaces as `session_not_ready` after 60s timeout —
#      high diagnosis cost. Pin `mcp` in EVERY hosted-agent pyproject.toml.
#
# Container GA. Pins current as of this skill's last_validated date in
# references/upstream-pin.md.

[project]
name = "my-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core~=1.14.0",
    "agent-framework-foundry~=1.11.0",
    "agent-framework-foundry-hosting==1.0.0b260813",
    "azure-ai-agentserver-core==2.1.0b1",
    "azure-ai-agentserver-responses==2.1.0b1",
    "azure-ai-agentserver-invocations==1.1.0b1",
    "azure-ai-projects~=2.3.0",
    "azure-identity~=1.25.3",
    "mcp~=1.29.0",
    "python-dotenv~=1.2.2",
    # OTel + gen_ai instrumentors are bundled via hosting → microsoft-opentelemetry.
    # Do NOT add explicit azure-monitor-opentelemetry or opentelemetry-* lines.
]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
prerelease = "if-necessary-or-explicit"

[tool.setuptools]
packages = []
