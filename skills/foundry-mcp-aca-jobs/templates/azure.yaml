# Canonical azd wiring for one-build digest convergence.
name: foundry-mcp-aca-jobs

services:
  mcp:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: .

hooks:
  preprovision:
    shell: sh
    interactive: false
    continueOnError: false
    run: |
      set -eu
      if [ "${MCP_ACA_JOBS_CI_REUSE:-}" != "" ] || [ -f ci-reuse.json ]; then
        python3 infra/scripts/ci_reuse.py check --project .
      fi
  predeploy:
    shell: sh
    interactive: false
    continueOnError: false
    run: |
      set -eu
      if [ "${MCP_ACA_JOBS_CI_REUSE:-}" != "" ] || [ -f ci-reuse.json ]; then
        python3 infra/scripts/ci_reuse.py check --project .
      fi
  postprovision:
    shell: sh
    interactive: false
    continueOnError: false
    run: |
      set -eu
      if [ "${MCP_ACA_JOBS_CI_REUSE:-}" != "" ] || [ -f ci-reuse.json ]; then
        python3 infra/scripts/ci_reuse.py record --project .
      fi
  postdeploy:
    shell: sh
    interactive: false
    continueOnError: false
    run: |
      set -eu
      cd infra/scripts && uv sync --frozen
      EXPECTED_IMAGE_DIGEST="$(uv run --frozen python converge_image.py)"
      EXPECTED_IMAGE_DIGEST="$EXPECTED_IMAGE_DIGEST" uv run --frozen python verify_deployment.py
