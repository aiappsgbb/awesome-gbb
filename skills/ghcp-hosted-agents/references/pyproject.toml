[project]
name = "my-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    # Microsoft Copilot SDK 2.0 (renamed from github-copilot-sdk). Both
    # distributions install the same `copilot` import package: uninstall
    # github-copilot-sdk before installing this one.
    "microsoft-copilot-sdk~=2.0.1",
    "azure-ai-agentserver-invocations~=1.3.0",
    "azure-ai-agentserver-core~=2.3.0",
    "azure-identity~=1.27.0",
    "pydantic~=2.11",
]

[tool.setuptools]
packages = []

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
